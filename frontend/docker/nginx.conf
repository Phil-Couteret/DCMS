server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # PWA / static assets - ensure served (avoid 403).
    # Filenames match vite-plugin-pwa's defaults (sw.js / manifest.webmanifest),
    # not CRA's old service-worker.js / manifest.json - see docs/roadmap.md item 18.
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        return 404;
    }
}
